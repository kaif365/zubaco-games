name: Game Services - CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'zubaco-games-repo/**'
  pull_request:
    branches: [main]
    paths:
      - 'zubaco-games-repo/**'

env:
  AWS_REGION: ap-south-1

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.changes.outputs.games }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed games
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE" ]; then
            BEFORE="${{ github.sha }}~1"
          fi
          GAMES=$(git diff --name-only "$BEFORE" ${{ github.sha }} | \
            grep "^zubaco-games-repo/zubaco-games/" | \
            cut -d'/' -f3 | sort -u | jq -R -s -c 'split("\n")[:-1]')
          if [ "$GAMES" = "null" ] || [ -z "$GAMES" ]; then
            GAMES="[]"
          fi
          echo "games=$GAMES" >> $GITHUB_OUTPUT

  build-game:
    needs: detect-changes
    if: needs.detect-changes.outputs.games != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        game: ${{ fromJson(needs.detect-changes.outputs.games) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build & Test Backend
        working-directory: zubaco-games-repo/zubaco-games/${{ matrix.game }}
        run: |
          BACKEND=$(ls -d *-backend 2>/dev/null || echo "")
          if [ -n "$BACKEND" ]; then
            cd $BACKEND
            npm ci --legacy-peer-deps
            npx prisma generate 2>/dev/null || true
            npx tsc --noEmit
            # Run unit/integration/engine/leaderboard tests (jest). Fails the build on test failure.
            npm run test --if-present
          fi

      - name: Build & Test Frontend
        working-directory: zubaco-games-repo/zubaco-games/${{ matrix.game }}
        run: |
          FRONTEND=$(ls -d *-frontend 2>/dev/null || echo "")
          if [ -n "$FRONTEND" ]; then
            cd $FRONTEND
            npm ci --legacy-peer-deps
            npm run build
            # Run Playwright end-to-end tests where the game defines them. Fails the build on test failure.
            if ls playwright.config.* >/dev/null 2>&1; then
              npx playwright install --with-deps chromium
              npm run test:e2e --if-present
            fi
          fi

  e2e-game:
    needs: detect-changes
    if: needs.detect-changes.outputs.games != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJson(needs.detect-changes.outputs.games) }}

    # Backend e2e suites boot the full Nest AppModule, which connects to Postgres
    # and Redis on init. Provide both as throwaway service containers.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zubaco
          POSTGRES_PASSWORD: zubaco_test
          POSTGRES_DB: game_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zubaco"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://zubaco:zubaco_test@localhost:5432/game_test?schema=public
      JWT_SECRET: test-secret
      HMAC_SECRET: dev-hmac-secret
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Backend E2E (Postgres + Redis)
        working-directory: zubaco-games-repo/zubaco-games/${{ matrix.game }}
        run: |
          BACKEND=$(ls -d *-backend 2>/dev/null || echo "")
          if [ -z "$BACKEND" ]; then
            echo "No backend for ${{ matrix.game }}; skipping e2e."
            exit 0
          fi
          cd $BACKEND
          # Skip games that do not define an e2e suite.
          if ! node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts['test:e2e'] ? 0 : 1)"; then
            echo "No test:e2e script for ${{ matrix.game }}; skipping."
            exit 0
          fi
          npm ci --legacy-peer-deps
          npx prisma generate
          # Provision the schema against the throwaway Postgres service container.
          if ls prisma/schema.prisma >/dev/null 2>&1; then
            npx prisma db push --accept-data-loss --skip-generate
          fi
          npm run test:e2e

  deploy-games:
    needs: [detect-changes, build-game, e2e-game]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        game: ${{ fromJson(needs.detect-changes.outputs.games) }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Deploy Backend
        working-directory: zubaco-games-repo/zubaco-games/${{ matrix.game }}
        run: |
          BACKEND=$(ls -d *-backend 2>/dev/null || echo "")
          if [ -n "$BACKEND" ]; then
            cd $BACKEND
            REPO_NAME="zubaco-${{ matrix.game }}-backend"
            docker build -t ${{ steps.login-ecr.outputs.registry }}/$REPO_NAME:${{ github.sha }} -f ../../docker/backend.Dockerfile .
            docker push ${{ steps.login-ecr.outputs.registry }}/$REPO_NAME:${{ github.sha }}
          fi

      - name: Build & Deploy Frontend to S3/CloudFront
        working-directory: zubaco-games-repo/zubaco-games/${{ matrix.game }}
        run: |
          FRONTEND=$(ls -d *-frontend 2>/dev/null || echo "")
          if [ -n "$FRONTEND" ]; then
            cd $FRONTEND
            npm ci --legacy-peer-deps
            npm run build
            aws s3 sync dist/ s3://zubaco-games-cdn/${{ matrix.game }}/ --delete
            aws cloudfront create-invalidation --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} --paths "/${{ matrix.game }}/*"
          fi
