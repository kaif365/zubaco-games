name: Platform API - CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'zubaco-platform/**'
      - '.github/workflows/platform-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'zubaco-platform/**'
      - '.github/workflows/platform-ci.yml'

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: zubaco-platform
  ECS_CLUSTER: zubaco-production
  ECS_SERVICE: platform-api

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zubaco-platform
        shell: bash

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zubaco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zubaco_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zubaco_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: test-access-secret-min-32-characters-000
      JWT_REFRESH_SECRET: test-refresh-secret-min-32-characters-00
      NODE_ENV: test
      INTERNAL_API_KEY: test-internal-key
      BASE_PLATFORM_WEBHOOK_URL: https://base-platform.example.test/webhook
      WEBHOOK_SIGNING_SECRET: integration-webhook-signing-secret
      WEBHOOK_MAX_ATTEMPTS: "3"
      WEBHOOK_BACKOFF_BASE_SECONDS: "0"
      WEBHOOK_BACKOFF_MAX_SECONDS: "0"
      WEBHOOK_TIMEOUT_MS: "2000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: zubaco-platform/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prepare log directory
        run: mkdir -p logs

      - name: Verify backing services are reachable
        run: |
          node -e '
            const net = require("net");
            const wait = (port, host) => new Promise((resolve, reject) => {
              let tries = 0;
              const attempt = () => {
                const s = net.connect(port, host);
                s.setTimeout(2000);
                s.once("connect", () => { s.destroy(); resolve(); });
                const retry = () => {
                  s.destroy();
                  if (++tries >= 30) return reject(new Error(host + ":" + port + " unreachable"));
                  setTimeout(attempt, 2000);
                };
                s.once("error", retry);
                s.once("timeout", retry);
              };
              attempt();
            });
            (async () => {
              await wait(5432, "localhost"); console.log("PostgreSQL reachable on 5432");
              await wait(6379, "localhost"); console.log("Redis reachable on 6379");
            })().catch((e) => { console.error(e.message); process.exit(1); });
          ' 2>&1 | tee logs/service-check.log

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type Check
        run: npx tsc --noEmit

      - name: Provision test database schema (Prisma)
        run: npx prisma db push --force-reset 2>&1 | tee logs/prisma-db-push.log

      - name: Run Unit Tests
        run: |
          set -o pipefail
          npm test -- --coverage --passWithNoTests --forceExit 2>&1 | tee logs/unit-tests.log

      - name: Run Integration Tests
        run: |
          set -o pipefail
          npm run test:integration -- --forceExit 2>&1 | tee logs/integration-tests.log

      - name: Build
        run: npm run build

      - name: Collect failure diagnostics
        if: failure()
        run: |
          node -e '
            const net = require("net");
            const probe = (port, host) => new Promise((resolve) => {
              const s = net.connect(port, host);
              s.setTimeout(2000);
              s.once("connect", () => { s.destroy(); resolve(host + ":" + port + " OPEN"); });
              const fail = () => { s.destroy(); resolve(host + ":" + port + " CLOSED"); };
              s.once("error", fail); s.once("timeout", fail);
            });
            (async () => {
              console.log(await probe(5432, "localhost"));
              console.log(await probe(6379, "localhost"));
              console.log("node " + process.version);
            })();
          ' 2>&1 | tee logs/diagnostics.log

      - name: Upload test logs & coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-test-artifacts
          path: |
            zubaco-platform/logs/
            zubaco-platform/coverage/
          if-no-files-found: ignore
          retention-days: 14

  deploy-staging:
    needs: test
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker Image
        working-directory: zubaco-platform
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:staging-${{ github.sha }} .
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:staging-${{ github.sha }}

      - name: Deploy to ECS Staging
        run: |
          aws ecs update-service \
            --cluster zubaco-staging \
            --service platform-api \
            --force-new-deployment

  deploy-production:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker Image
        working-directory: zubaco-platform
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} .
          docker tag ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Deploy to ECS Production
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment
