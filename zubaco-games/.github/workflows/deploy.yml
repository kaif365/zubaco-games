name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      game:
        description: "Game to deploy (or 'all')"
        required: true
        default: all
        type: choice
        options:
          - all
          - colour-sorting
          - flash-spot
          - object-placement-memory
          - rapid-category-sort
          - true-false-blitz
          - word-unscramble
          - number-grid-sprint
          - live-route-builder
          - memory-groups
          - reflex-endurance
          - pattern-survival
          - speed-type-answer
          - sequence-recall
          - memory-card-matching
          - sliding-puzzle
          - block-fill
          - maze-navigation
          - infinity-loop
          - arrows
          - logic-reflector

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend images
        run: |
          GAMES=(
            "colour-sorting/colour-sorting-backend"
            "flash-spot/flash-spot-backend"
            "object-placement-memory/object-placement-memory-backend"
            "rapid-category-sort/rapid-sort-backend"
            "true-false-blitz/true-false-blitz-backend"
            "word-unscramble/word-unscramble-backend"
            "number-grid-sprint/number-grid-backend"
            "live-route-builder/live-route-backend"
            "memory-groups/memory-groups-backend"
            "reflex-endurance/reflex-endurance-backend"
            "pattern-survival/pattern-survival-backend"
            "speed-type-answer/speed-type-backend"
            "sequence-recall/sequence-recall-backend"
            "memory-card-matching/memory-card-matching-backend"
            "sliding-puzzle/sliding-puzzle-backend"
            "block-fill/block-fill-backend"
            "maze-navigation/maze-navigation-backend"
            "Infinity-loop/Infinity-Loop-backend"
            "arrows/arrows-backend"
            "logic-reflector/logic-reflector-backend"
          )
          for GAME_DIR in "${GAMES[@]}"; do
            NAME=$(echo "$GAME_DIR" | sed 's|.*/||')
            echo "Building $NAME..."
            docker buildx build \
              --file docker/backend.Dockerfile \
              --build-arg GAME_DIR="$GAME_DIR" \
              --tag "$ECR_REGISTRY/$NAME:${{ github.sha }}" \
              --tag "$ECR_REGISTRY/$NAME:latest" \
              --push \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              .
          done

      - name: Build & push frontend images
        run: |
          GAMES=(
            "colour-sorting/colour-sorting-frontend"
            "flash-spot/flash-spot-frontend"
            "object-placement-memory/object-placement-memory-frontend"
            "rapid-category-sort/rapid-sort-frontend"
            "true-false-blitz/true-false-blitz-frontend"
            "word-unscramble/word-unscramble-frontend"
            "number-grid-sprint/number-grid-frontend"
            "live-route-builder/live-route-frontend"
            "memory-groups/memory-groups-frontend"
            "reflex-endurance/reflex-endurance-frontend"
            "pattern-survival/pattern-survival-frontend"
            "speed-type-answer/speed-type-frontend"
            "sequence-recall/sequence-recall-frontend"
            "memory-card-matching/memory-card-matching-frontend"
            "sliding-puzzle/sliding-puzzle-frontend"
            "block-fill/block-fill-frontend"
            "maze-navigation/maze-navigation-frontend"
            "Infinity-loop/infinity-loop-frontend"
            "arrows/arrows-frontend"
            "logic-reflector/logic-reflector-frontend"
          )
          for GAME_DIR in "${GAMES[@]}"; do
            NAME=$(echo "$GAME_DIR" | sed 's|.*/||')
            echo "Building $NAME..."
            docker buildx build \
              --file docker/frontend.Dockerfile \
              --build-arg GAME_DIR="$GAME_DIR" \
              --tag "$ECR_REGISTRY/$NAME:${{ github.sha }}" \
              --tag "$ECR_REGISTRY/$NAME:latest" \
              --push \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              .
          done

      - name: Deploy to ECS
        run: |
          echo "Deploying platform service..."
          aws ecs update-service \
            --cluster zubaco-production \
            --service zubaco-platform \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

          echo "Deploying admin service..."
          aws ecs update-service \
            --cluster zubaco-production \
            --service zubaco-admin \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Run database migrations
        run: |
          echo "Running Prisma migrations via ECS run-task..."
          TASK_ARN=$(aws ecs run-task \
            --cluster zubaco-production \
            --task-definition zubaco-platform-production \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$(aws ecs describe-services --cluster zubaco-production --services zubaco-platform --query 'services[0].networkConfiguration.awsvpcConfiguration.subnets' --output text | tr '\t' ',')],securityGroups=[$(aws ecs describe-services --cluster zubaco-production --services zubaco-platform --query 'services[0].networkConfiguration.awsvpcConfiguration.securityGroups' --output text | tr '\t' ',')],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"platform","command":["npx","prisma","migrate","deploy"]}]}' \
            --query 'tasks[0].taskArn' --output text \
            --region ${{ env.AWS_REGION }})
          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster zubaco-production --tasks "$TASK_ARN" --region ${{ env.AWS_REGION }}
          EXIT_CODE=$(aws ecs describe-tasks --cluster zubaco-production --tasks "$TASK_ARN" --query 'tasks[0].containers[0].exitCode' --output text --region ${{ env.AWS_REGION }})
          if [ "$EXIT_CODE" != "0" ]; then echo "Migration failed with exit code $EXIT_CODE"; exit 1; fi
          echo "Migrations complete."

      - name: Wait for deployment stability
        run: |
          echo "Waiting for platform service to stabilize..."
          aws ecs wait services-stable \
            --cluster zubaco-production \
            --services zubaco-platform \
            --region ${{ env.AWS_REGION }}
          echo "Deployment stable."

      - name: Health check
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers --names zubaco-production --query 'LoadBalancers[0].DNSName' --output text --region ${{ env.AWS_REGION }} 2>/dev/null || echo "")
          if [ -n "$ALB_DNS" ]; then
            for i in 1 2 3 4 5; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$ALB_DNS/api/v1/health" --max-time 10 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then echo "Health check passed!"; exit 0; fi
              echo "Attempt $i: HTTP $STATUS, retrying in 15s..."
              sleep 15
            done
            echo "Health check failed after 5 attempts"
            exit 1
          else
            echo "ALB not found, skipping health check"
          fi
