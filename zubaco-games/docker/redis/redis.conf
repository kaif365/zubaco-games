# ==============================================================================
# Zubaco High-Performance Redis Production Configuration (Module 8.5)
# ==============================================================================

# Network & Connection Parameters
bind 0.0.0.0
port 6379
tcp-backlog 2048
timeout 300
tcp-keepalive 60

# Concurrency & Client Management
maxclients 10000

# Memory Management & Eviction Governance
# volatile-lru: evicts least recently used keys among those with an explicit TTL set.
# Critical keys without expiration are strictly preserved.
maxmemory 1gb
maxmemory-policy volatile-lru
maxmemory-samples 10

# Persistence & Durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Performance Tuning
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Slowlog Monitoring (queries > 10ms logged)
slowlog-log-slower-than 10000
slowlog-max-len 1024

