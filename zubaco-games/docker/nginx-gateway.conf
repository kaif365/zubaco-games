upstream flash_spot { server flash-spot-backend:3000; }
upstream colour_sorting { server colour-sorting-backend:3000; }
upstream object_placement { server object-placement-memory-backend:3000; }
upstream rapid_sort { server rapid-sort-backend:3000; }
upstream true_false_blitz { server true-false-blitz-backend:3000; }
upstream word_unscramble { server word-unscramble-backend:3000; }
upstream number_grid { server number-grid-backend:3000; }
upstream live_route { server live-route-backend:3000; }
upstream memory_groups { server memory-groups-backend:3000; }
upstream reflex_endurance { server reflex-endurance-backend:3000; }
upstream pattern_survival { server pattern-survival-backend:3000; }
upstream speed_type { server speed-type-backend:3000; }
upstream sequence_recall { server sequence-recall-backend:3000; }
upstream memory_card_matching { server memory-card-matching-backend:3000; }
upstream sliding_puzzle { server sliding-puzzle-backend:3000; }
upstream block_fill { server block-fill-backend:3000; }
upstream maze_navigation { server maze-navigation-backend:3000; }
upstream infinity_loop { server infinity-loop-backend:3000; }
upstream arrows { server arrows-backend:3000; }
upstream logic_reflector { server logic-reflector-backend:3000; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ─── Rate Limiting Zones ─────────────────────────────────────
# 10 req/s per IP for API, burst up to 20
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# 2 req/s for auth endpoints (login, OTP)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;
# 50 req/s for static/leaderboard
limit_req_zone $binary_remote_addr zone=read_limit:10m rate=50r/s;

# Connection limits: max 100 concurrent per IP
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ─── Response Caching ────────────────────────────────────────
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=5m;

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Request size limit
    client_max_body_size 10m;

    # Connection limit
    limit_conn conn_limit 100;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # WebSocket timeout (long-lived connections)
    map $http_upgrade $proxy_read_timeout_ws {
        default 30s;
        websocket 3600s;
    }

    # Common proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ─── Game API Routes (rate limited) ───
    location /api/flash-spot/ { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://flash_spot/api/; }
    location /api/colour-sorting/ { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://colour_sorting/api/; }
    location /api/object-placement/ { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://object_placement/api/; }
    location /api/rapid-sort/ { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://rapid_sort/api/; }
    location /api/true-false-blitz/ { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://true_false_blitz/api/; }
    location /api/word-unscramble/ { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://word_unscramble/api/; }
    location /api/number-grid/ { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://number_grid/api/; }
    location /api/live-route/ { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://live_route/api/; }
    location /api/memory-groups/ { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://memory_groups/api/; }
    location /api/reflex-endurance/ { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://reflex_endurance/api/; }
    location /api/pattern-survival/ { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://pattern_survival/api/; }
    location /api/speed-type/ { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://speed_type/api/; }
    location /api/sequence-recall/ { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://sequence_recall/api/; }
    location /api/memory-card-matching/ { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://memory_card_matching/api/; }
    location /api/sliding-puzzle/ { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://sliding_puzzle/api/; }
    location /api/block-fill/ { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://block_fill/api/; }
    location /api/maze-navigation/ { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://maze_navigation/api/; }
    location /api/infinity-loop/ { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://infinity_loop/api/; }
    location /api/arrows/ { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://arrows/api/; }
    location /api/logic-reflector/ { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://logic_reflector/api/; }

    # ─── WebSocket Routes (Socket.IO) ───
    location /ws/flash-spot/ {
        proxy_pass http://flash_spot/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /ws/colour-sorting/ {
        proxy_pass http://colour_sorting/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /ws/object-placement/ {
        proxy_pass http://object_placement/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /ws/rapid-sort/ {
        proxy_pass http://rapid_sort/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /ws/true-false-blitz/ {
        proxy_pass http://true_false_blitz/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /ws/word-unscramble/ {
        proxy_pass http://word_unscramble/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /ws/number-grid/ {
        proxy_pass http://number_grid/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /ws/live-route/ {
        proxy_pass http://live_route/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /ws/memory-groups/ {
        proxy_pass http://memory_groups/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /ws/reflex-endurance/ {
        proxy_pass http://reflex_endurance/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /ws/pattern-survival/ {
        proxy_pass http://pattern_survival/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /ws/speed-type/ {
        proxy_pass http://speed_type/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /ws/sequence-recall/ {
        proxy_pass http://sequence_recall/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /ws/memory-card-matching/ {
        proxy_pass http://memory_card_matching/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /ws/sliding-puzzle/ {
        proxy_pass http://sliding_puzzle/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /ws/block-fill/ {
        proxy_pass http://block_fill/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /ws/maze-navigation/ {
        proxy_pass http://maze_navigation/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /ws/infinity-loop/ {
        proxy_pass http://infinity_loop/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /ws/arrows/ {
        proxy_pass http://arrows/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /ws/logic-reflector/ {
        proxy_pass http://logic_reflector/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # ─── Platform API (leaderboard caching + rate limiting) ───
    location /api/v1/leaderboard/ {
        limit_req zone=read_limit burst=50 nodelay;
        proxy_cache api_cache;
        proxy_cache_valid 200 5s;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_pass http://platform:3000/api/v1/leaderboard/;
    }

    location /api/v1/tournament/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://platform:3000/api/v1/tournament/;
    }

    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://platform:3000/api/v1/auth/;
    }

    location /api/v1/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://platform:3000/api/v1/;
    }

    # ─── Rate limit error page ───
    error_page 429 /429.json;
    location = /429.json {
        return 429 '{"error":"Too many requests","retry_after":1}';
        add_header Content-Type application/json always;
        add_header Retry-After 1 always;
    }

    # ─── Health Checks ───
    location /health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # ─── Prometheus Metrics (internal) ───
    location /nginx-status {
        stub_status on;
        allow 172.16.0.0/12;
        deny all;
    }
}
