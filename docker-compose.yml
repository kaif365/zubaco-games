version: '3.8'

services:
  # ─── PostgreSQL ───
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zubaco_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ───
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # OPS-S2 (O7): AOF persistence + bounded memory with an LRU eviction policy
    # so Redis survives a restart and degrades predictably under memory pressure
    # instead of being OOM-killed.
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "512mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Zubaco Platform API ───
  platform:
    build:
      context: ./zubaco-platform
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/zubaco_platform
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: zubaco-access-secret-change-in-production-min-32
      JWT_REFRESH_SECRET: zubaco-refresh-secret-change-in-production-min-32
      NODE_ENV: production
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/v1/health/ready",
        ]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3

  # ─── Admin Panel Backend ───
  admin-backend:
    build:
      context: ./zubaco-admin-panel-repo/zubaco-admin-panel/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/zubaco_platform
      REDIS_HOST: redis
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Admin Panel Frontend ───
  admin-frontend:
    build:
      context: ./zubaco-admin-panel-repo/zubaco-admin-panel/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      - admin-backend

volumes:
  postgres_data:
  redis_data:
